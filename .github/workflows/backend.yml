# Tests du backend sur SQLite puis sur Postgres. Runner Linux : coût minimal.
name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: motivplan
          POSTGRES_PASSWORD: motivplan
          POSTGRES_DB: motivplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motivplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Tests SQLite
        run: uv run pytest
      - name: Tests Postgres
        env:
          MOTIVPLAN_TEST_DATABASE_URL: postgresql+psycopg://motivplan:motivplan@localhost:5432/motivplan_test
        run: uv run pytest
