# Compilation et tests iOS sans Mac local.
# Le moteur se teste d'abord sur Linux (peu coûteux) ; le runner macOS, facturé 10 fois plus
# sur un dépôt privé, ne démarre que si le moteur est vert.
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: TimelineEngine (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path ios/Packages/TimelineEngine

  app:
    name: App (macOS)
    needs: engine
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Sélection du Xcode le plus récent
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Tests MotivPlanCore
        run: swift test --package-path Packages/MotivPlanCore
      - name: Build app + widget (simulateur, sans signature)
        run: |
          xcodebuild build \
            -project MotivPlan.xcodeproj \
            -scheme MotivPlan \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Journal de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
