# Compilation et tests iOS sans Mac local.
# Le moteur se teste d'abord sur Linux (peu coûteux) ; le runner macOS, facturé 10 fois plus
# sur un dépôt privé, ne démarre que si le moteur est vert.
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: TimelineEngine (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path ios/Packages/TimelineEngine

  app:
    name: App (macOS)
    needs: engine
    # Mac Intel : les runners Apple silicon (macos-latest) étaient saturés le 2026-10-14.
    # Repasser à macos-latest quand ils redeviennent disponibles (builds plus rapides).
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Sélection du Xcode le plus récent
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Tests MotivPlanCore
        run: swift test --package-path Packages/MotivPlanCore
      - name: Build + tests d'interface (simulateur, sans signature)
        run: |
          # Premier iPhone disponible sur le runtime iOS le plus récent.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(p) for p in k.split(".iOS-")[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          echo "Simulateur : $UDID"
          xcodebuild test \
            -project MotivPlan.xcodeproj \
            -scheme MotivPlan \
            -destination "id=$UDID" \
            -resultBundlePath Screens.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Export des captures d'écran
        if: always()
        run: |
          [ -d Screens.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path Screens.xcresult --output-path screenshots
          # Renomme les fichiers exportés avec le nom donné dans le test. Les noms automatiques
          # (captures d'échec) peuvent contenir des caractères refusés par upload-artifact.
          python3 - <<'PY'
          import json, os, re
          manifest = json.load(open("screenshots/manifest.json"))
          used = set()
          for test in manifest:
              test_name = re.sub(r"[^\w-]+", "", test.get("testIdentifier", "").split("/")[-1])
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  ext = os.path.splitext(a["exportedFileName"])[1]
                  base = re.sub(r"[^\w.-]+", "-", os.path.splitext(name.split("_")[0])[0]).strip("-")
                  if not re.match(r"^\d", base):
                      base = f"echec-{test_name}-{base}"
                  candidate, n = base, 2
                  while candidate in used:
                      candidate, n = f"{base}-{n}", n + 1
                  used.add(candidate)
                  os.rename(f"screenshots/{a['exportedFileName']}", f"screenshots/{candidate}{ext}")
          PY
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore
      - name: Journal de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
